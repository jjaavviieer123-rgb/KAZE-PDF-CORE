[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kaze-pdf-core"
version = "0.1.2"
description = "Motor LaTeX compartido para los presupuestos de KaZe"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kaze_pdf_core = ["plantilla.tex"]
